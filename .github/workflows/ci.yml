name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # No [yolo] here: the test suite stubs the backend on purpose, so CI
          # needs neither torch nor network access to model weights.
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests benchmarks examples

      - name: Format check
        run: ruff format --check src tests benchmarks examples

      - name: Test
        run: pytest --cov=smartdive --cov-report=term-missing
